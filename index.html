<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code | コマンドリファレンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#141413;--bg2:#1a1916;--card:#1f1e1c;--card-hover:#252420;
    --border:#2e2c28;--border-bright:#3d3a34;
    --accent:#d97757;--accent-dim:rgba(217,119,87,0.08);--accent-mid:rgba(217,119,87,0.18);
    --text:#c4bfb6;--text-dim:#6b6660;--text-bright:#f0ebe3;
    --code:#e8956d;--code-arg:#f0c070;--code-flag:#a8c4a0;
    --green:#7aad72;--sidebar-w:230px;
    --mono:'JetBrains Mono',monospace;--sans:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .logo{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .logo span{color:var(--text-dim);font-weight:300;}
  .hdiv{width:1px;height:18px;background:var(--border-bright);flex-shrink:0;}
  .badge{font-family:var(--mono);font-size:9px;padding:2px 7px;border:1px solid var(--accent);color:var(--accent);border-radius:3px;letter-spacing:1px;opacity:.65;}
  .swrap{flex:1;max-width:360px;margin-left:auto;position:relative;}
  .sicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;pointer-events:none;font-family:var(--mono);}
  #si{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 10px 6px 30px;font-family:var(--mono);font-size:12px;color:var(--text-bright);outline:none;transition:border-color .2s,box-shadow .2s;}
  #si::placeholder{color:var(--text-dim);}
  #si:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,119,87,.12);}
  .layout{display:flex;min-height:calc(100vh - 56px);}
  aside{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
  .slbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--text-dim);padding:0 16px 8px;text-transform:uppercase;}
  .cb{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--sans);font-size:12px;color:var(--text-dim);border-left:2px solid transparent;transition:all .15s;}
  .cb:hover{background:var(--accent-dim);color:var(--text);}
  .cb.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-dim);font-weight:500;}
  .ci{font-size:13px;width:16px;text-align:center;flex-shrink:0;}
  .cc{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--border);padding:1px 5px;border-radius:8px;color:var(--text-dim);}
  .cb.active .cc{background:var(--accent-mid);color:var(--accent);}
  main{flex:1;padding:24px 28px;min-width:0;}
  .sh{margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .st{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--text-bright);display:flex;align-items:center;gap:8px;}
  .st .ic{color:var(--accent);}
  .sd{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.6;}
  .rc{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:right;margin-bottom:14px;}
  .rc span{color:var(--accent);font-weight:700;}
  .cg{display:grid;grid-template-columns:1fr;gap:10px;}
  .cc2{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:14px 16px;transition:border-color .18s,background .18s;position:relative;overflow:hidden;}
  .cc2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .18s;}
  .cc2:hover{background:var(--card-hover);border-color:var(--border-bright);}
  .cc2:hover::before{opacity:1;}
  .ct{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;}
  .cd{flex:1;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--code);line-height:1.4;word-break:break-all;}
  .pr{color:var(--text-dim);user-select:none;margin-right:3px;}
  .cb2{flex-shrink:0;padding:3px 10px;border:1px solid var(--border-bright);border-radius:4px;background:transparent;color:var(--text-dim);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .cb2:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .cb2.copied{border-color:var(--green);color:var(--green);background:rgba(122,173,114,.08);}
  .dv{height:1px;background:var(--border);margin:9px 0;}
  .de{font-size:12px;color:var(--text);line-height:1.75;margin-bottom:9px;}
  .el{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
  .ex{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);overflow-x:auto;}
  .ep{color:var(--accent);opacity:.45;margin-right:3px;}
  .ts{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 6px;background:rgba(122,173,114,.12);border:1px solid rgba(122,173,114,.3);color:var(--green);border-radius:3px;margin-left:8px;vertical-align:middle;}
  .gl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;padding:6px 0 10px;margin-top:10px;border-top:1px solid var(--border);}
  .gl:first-child{margin-top:0;border-top:none;}
  .es{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .ei{font-size:32px;margin-bottom:10px;opacity:.35;}
  .mt{display:none;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 12px;gap:2px;scrollbar-width:none;}
  .mt::-webkit-scrollbar{display:none;}
  .mtt{flex-shrink:0;padding:9px 12px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-family:var(--sans);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .mtt.active{color:var(--accent);border-bottom-color:var(--accent);}
  @media(max-width:768px){aside{display:none;}.mt{display:flex;}main{padding:16px 14px;}.swrap{max-width:180px;}.logo span{display:none;}header{padding:0 12px;}}
  @media(max-width:480px){.badge{display:none;}.hdiv{display:none;}}
  ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:3px;}
  .c-base{color:var(--accent);}.c-sub{color:#c4a882;}.c-flag{color:var(--code-flag);}.c-arg{color:var(--code-arg);}.c-pipe{color:var(--text-dim);}.c-str{color:#ff9f7f;}
</style>

let curCat='all',q='';
function cnt(id){return id==='all'?cmds.length:cmds.filter(c=>c.cat===id).length;}
function buildNav(){
  const sb=document.getElementById('sb'),mt=document.getElementById('mt');
  sb.innerHTML='';mt.innerHTML='';
  const lbl=document.createElement('div');lbl.className='slbl';lbl.textContent='CATEGORY';sb.appendChild(lbl);
  cats.forEach(cat=>{
    const b=document.createElement('button');b.className='cb'+(cat.id===curCat?' active':'');
    b.innerHTML='<span class="ci">'+cat.icon+'</span>'+cat.label+'<span class="cc">'+cnt(cat.id)+'</span>';
    b.onclick=()=>{curCat=cat.id;q='';document.getElementById('si').value='';buildNav();renderMain();};
    sb.appendChild(b);
    const t=document.createElement('button');t.className='mtt'+(cat.id===curCat?' active':'');
    t.textContent=cat.label;t.onclick=()=>{curCat=cat.id;q='';document.getElementById('si').value='';buildNav();renderMain();};
    mt.appendChild(t);
  });
}
function renderMain(){
  const mc=document.getElementById('mc');
  const cat=cats.find(c=>c.id===curCat);
  let filtered=cmds.filter(cmd=>{
    if(curCat!=='all'&&cmd.cat!==curCat)return false;
    if(!q)return true;
    const lq=q.toLowerCase();
    return cmd.syn.toLowerCase().includes(lq)||cmd.desc.toLowerCase().includes(lq)||cmd.copy.toLowerCase().includes(lq);
  });
  let html='';
  if(curCat!=='all'&&!q)html+='<div class="sh"><div class="st"><span class="ic">'+cat.icon+'</span>'+cat.label+'</div><div class="sd">'+cat.desc+'</div></div>';
  if(q)html+='<div class="rc">検索結果: <span>'+filtered.length+'</span> 件</div>';
  if(filtered.length===0){
    html+='<div class="es"><div class="ei">⌀</div><p>該当するコマンドが見つかりません</p></div>';
  } else {
    html+='<div class="cg">';
    if(curCat==='all'&&!q){
      cats.filter(c=>c.id!=='all').forEach(cat=>{
        const cc=filtered.filter(cmd=>cmd.cat===cat.id);
        if(!cc.length)return;
        html+='<div class="gl">'+cat.icon+'  '+cat.label+'</div>';
        cc.forEach(cmd=>{html+=card(cmd);});
      });
    } else {filtered.forEach(cmd=>{html+=card(cmd);});}
    html+='</div>';
  }
  mc.innerHTML=html;
  mc.querySelectorAll('.cb2').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const txt=btn.dataset.copy;
      btn.textContent='✓ Copied!';btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2000);
      try{navigator.clipboard.writeText(txt);}catch(_){
        const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
      }
    };
  });
}
function card(cmd){
  const sk=cmd.isSkill?'<span class="ts">Skill</span>':'';
  const copy=cmd.copy.replace(/"/g,'&quot;');
  return '<div class="cc2"><div class="ct"><div class="cd"><span class="pr">$</span>'+cmd.r+sk+'</div>'
    +'<button class="cb2" data-copy="'+copy+'">Copy</button></div>'
    +'<div class="dv"></div><div class="de">'+cmd.desc+'</div>'
    +'<div class="el">使用例</div><div class="ex"><span class="ep">$</span>'+cmd.exH+'</div></div>';
}
document.getElementById('si').addEventListener('input',e=>{
  q=e.target.value.trim();
  if(q&&curCat!=='all'){curCat='all';buildNav();}
  renderMain();
});
buildNav();renderMain();
</script>
